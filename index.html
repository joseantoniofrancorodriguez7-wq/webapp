<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC 27 - Cartas de los mejores jugadores</title>
<style>
  :root{
    --bg1:#050816; --bg2:#14093d; --accent:#00ff9d; --accent2:#00d4ff; --gold:#ffd86b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{
    min-height:100vh;color:#fff;overflow-x:hidden;
    background:radial-gradient(circle at 20% 10%,#1d1160 0,transparent 45%),
               radial-gradient(circle at 85% 80%,#06394a 0,transparent 45%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
  }
  /* partículas de fondo */
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  header,.controls,.grid,footer{position:relative;z-index:1}

  header{text-align:center;padding:50px 20px 10px}
  header h1{
    font-size:clamp(2.2rem,7vw,4.6rem);font-weight:900;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold),var(--accent));
    background-size:300% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:300% center}}
  header p{margin-top:8px;opacity:.7;letter-spacing:5px;text-transform:uppercase;font-size:.95rem}

  /* controles */
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
    max-width:1100px;margin:28px auto 6px;padding:0 20px;
  }
  .controls input,.controls select{
    background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);
    border-radius:12px;padding:10px 14px;font-size:.95rem;outline:none;
  }
  .controls select option{background:#14093d;color:#fff}
  .controls input:focus,.controls select:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;
    padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.85rem;
    transition:.25s;
  }
  .chip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04101f;border-color:transparent}
  #count{opacity:.6;font-size:.85rem;width:100%;text-align:center}

  /* rejilla */
  .grid{
    display:grid;gap:34px 24px;max-width:1250px;margin:30px auto 40px;padding:0 20px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));justify-items:center;
  }

  /* ===== CARTA ===== */
  .scene{width:230px;height:330px;perspective:900px;cursor:pointer;
    opacity:0;transform:translateY(60px) scale(.9);animation:dealIn .7s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes dealIn{to{opacity:1;transform:none}}
  .card{
    --c1:#f6e27a; --c2:#b8860b; --txt:#3b2a00;
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .15s ease-out,filter .3s;
    clip-path:polygon(50% 0,92% 6%,100% 8%,100% 88%,50% 100%,0 88%,0 8%,8% 6%);
    background:linear-gradient(160deg,var(--c1),var(--c2));
    color:var(--txt);
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .scene:hover .card{filter:drop-shadow(0 0 28px var(--c1)) drop-shadow(0 18px 22px rgba(0,0,0,.6))}
  .card::before{ /* patrón interior */
    content:'';position:absolute;inset:6px;
    clip-path:polygon(50% 0,92% 6%,100% 8%,100% 88%,50% 100%,0 88%,0 8%,8% 6%);
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px),
      linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);
  }
  .card::after{ /* brillo holográfico */
    content:'';position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,rgba(120,255,255,.25) 52%,transparent 70%);
    background-size:250% 100%;background-position:var(--sx,130%) 0;
    mix-blend-mode:overlay;transition:background-position .1s;pointer-events:none;
  }
  .scene:hover .card::after{animation:sweep 1.2s ease}
  @keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}

  .rate{position:absolute;top:36px;left:28px;text-align:center;line-height:1}
  .rate b{display:block;font-size:2.7rem;font-weight:900}
  .rate span{font-size:1rem;font-weight:800;letter-spacing:1px}
  .side{position:absolute;top:122px;left:24px;width:44px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .flag{width:34px;height:23px;object-fit:cover;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .crest{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.62rem;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.85);
    box-shadow:0 1px 5px rgba(0,0,0,.5);text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .crest-wrap{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .crest-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
    animation:photoIn .5s ease both}
  .mcrest{display:inline-flex}
  .mcrest .crest-wrap{width:30px;height:30px}
  .mcrest .crest{width:28px;height:28px}
  .avatar{
    position:absolute;top:34px;right:22px;width:128px;height:128px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;
    color:rgba(0,0,0,.55);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(255,255,255,.12));
    animation:bob 4s ease-in-out infinite;overflow:hidden;
    border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;
    animation:photoIn .6s ease both}
  @keyframes photoIn{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:none}}
  /* recorte sin fondo: sin círculo, el jugador "sale" de la carta */
  .avatar.cutout{
    top:30px;right:10px;width:150px;height:150px;border-radius:0;background:none;border:none;
    box-shadow:none;overflow:visible;animation:none;
  }
  .avatar.cutout img{
    object-fit:contain;object-position:50% 100%;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));
    animation:cutIn .7s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cutIn{from{opacity:0;transform:translateY(24px) scale(.8)}to{opacity:1;transform:none}}
  .scene:hover .avatar.cutout img{transform:scale(1.08) translateY(-4px);transition:transform .3s}
  .pname{z-index:2}
  #cutbar{
    display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
    background:rgba(5,8,22,.92);border:1px solid rgba(255,255,255,.2);border-radius:14px;
    padding:10px 18px;font-size:.85rem;min-width:280px;text-align:center;
  }
  #cutbar div{height:5px;margin-top:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
  #cutbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .pname{
    position:absolute;top:172px;left:0;right:0;text-align:center;font-weight:900;
    font-size:1.12rem;letter-spacing:1px;text-transform:uppercase;padding:0 18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .line{position:absolute;top:200px;left:30px;right:30px;height:2px;background:currentColor;opacity:.35}
  .stats{
    position:absolute;top:208px;left:26px;right:26px;display:grid;
    grid-template-columns:1fr 1fr;gap:3px 14px;font-weight:800;font-size:.95rem;
  }
  .stats div{display:flex;justify-content:center;gap:6px}
  .stats em{font-style:normal;opacity:.75;font-weight:700}

  /* rarezas */
  .gold{--c1:#f6e27a;--c2:#b8860b;--txt:#3b2a00}
  .icon{--c1:#fdf6dd;--c2:#c9a45c;--txt:#4a3410}
  .toty{--c1:#4aa8ff;--c2:#0a2a8c;--txt:#e9f4ff}
  .hero{--c1:#ff7be5;--c2:#6a1bb0;--txt:#fff2ff}
  .special{--c1:#38f0b5;--c2:#0b5a6e;--txt:#eafff8}

  /* ===== MODAL ===== */
  #modal{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,20,.8);backdrop-filter:blur(8px);padding:20px;
  }
  #modal.open{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes float{50%{transform:translateY(-12px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .panel{
    display:flex;gap:34px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    border-radius:24px;padding:34px;max-width:760px;width:100%;
    animation:pop .45s cubic-bezier(.2,1.2,.3,1);position:relative;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .panel .scene{animation:none;opacity:1;transform:none;cursor:default}
  .info{flex:1;min-width:250px}
  .info h2{font-size:1.8rem;margin-bottom:4px}
  .meta{display:flex;gap:10px;align-items:center;margin-bottom:6px;opacity:.85;font-size:.95rem}
  .meta img{width:28px;height:19px;border-radius:3px;object-fit:cover}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tag{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700}
  .bar-row{margin:9px 0}
  .bar-top{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;font-weight:700}
  .bar{height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  #close{
    position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;
    font-size:1.8rem;cursor:pointer;opacity:.7;transition:.2s
  }
  #close:hover{opacity:1;transform:rotate(90deg)}

  .empty{grid-column:1/-1;text-align:center;opacity:.6;padding:60px 0}
  footer{text-align:center;padding:10px 20px 50px;opacity:.45;font-size:.82rem}

  /* ===== SOBRES ===== */
  .chip.pack-btn{background:linear-gradient(90deg,#ff9d00,#ffd86b);color:#2b1a00;border-color:transparent;
    animation:pulseBtn 2s ease-in-out infinite}
  @keyframes pulseBtn{50%{box-shadow:0 0 22px rgba(255,200,0,.7);transform:scale(1.06)}}
  #packs{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#1d1160,#02030c 70%);padding:20px;overflow:hidden}
  #packs.open{display:flex;animation:fade .3s}
  #pkClose{position:absolute;top:14px;right:20px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;opacity:.7}
  #pkClose:hover{opacity:1}
  #pkCount{position:absolute;top:20px;left:24px;font-weight:800;letter-spacing:1px;opacity:.8;font-size:.9rem}
  #pkStage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:470px}
  .hint{margin-top:34px;opacity:.75;letter-spacing:3px;text-transform:uppercase;font-size:.85rem;animation:blink 1.6s infinite;transition:opacity .3s}
  @keyframes blink{50%{opacity:.25}}

  .pack-wrap{filter:drop-shadow(0 20px 30px rgba(0,0,0,.7)) drop-shadow(0 0 24px rgba(0,180,255,.45));
    animation:float 3.2s ease-in-out infinite;cursor:pointer}
  .pack{
    position:relative;width:190px;height:290px;overflow:hidden;
    background:linear-gradient(150deg,#16215f,#6a1bb0 45%,#00b3ff);
    clip-path:polygon(0 2%,10% 0,20% 2%,30% 0,40% 2%,50% 0,60% 2%,70% 0,80% 2%,90% 0,100% 2%,
      100% 98%,90% 100%,80% 98%,70% 100%,60% 98%,50% 100%,40% 98%,30% 100%,20% 98%,10% 100%,0 98%);
    display:flex;align-items:center;justify-content:center;
  }
  .pack::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(60deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px)}
  .pack::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sheen 2.8s ease-in-out infinite}
  @keyframes sheen{to{left:140%}}
  .pk-in{position:relative;z-index:1;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .pk-in b{display:block;font-size:3rem;font-weight:900;letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#ffd86b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .pk-in span{display:block;font-weight:800;letter-spacing:3px;font-size:.8rem;margin-top:4px}
  .pk-in em{display:block;margin-top:26px;font-style:normal;font-size:.7rem;color:#ffd86b;letter-spacing:2px}
  .pack-wrap:hover{transform:scale(1.05)}
  .pack-wrap.shake{animation:shake .12s linear infinite;cursor:default}
  @keyframes shake{
    0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-9px,3px) rotate(-5deg)}
    50%{transform:translate(8px,-4px) rotate(4deg)}75%{transform:translate(-7px,-2px) rotate(-3deg)}100%{transform:translate(0,0) rotate(0)}}
  .pack-wrap.burst{animation:burst .5s ease-in forwards}
  @keyframes burst{0%{transform:scale(1);filter:brightness(1)}60%{transform:scale(1.35);filter:brightness(3)}
    100%{transform:scale(1.9);opacity:0;filter:brightness(6)}}
  #flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
  #flash.go{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

  .rv-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:420px;height:420px;max-width:100%}
  .rv-wrap::before{content:'';position:absolute;inset:0;border-radius:50%;opacity:0;
    background:conic-gradient(from 0deg,transparent,rgba(0,212,255,.55),transparent 25%,rgba(0,255,157,.45),transparent 50%,rgba(0,212,255,.55),transparent 75%);
    -webkit-mask:radial-gradient(circle,transparent 22%,#000 23%,transparent 70%);mask:radial-gradient(circle,transparent 22%,#000 23%,transparent 70%);}
  .rv-wrap.rare::before{opacity:.9;animation:spin 5s linear infinite}
  .rv-wrap.epic::before{opacity:1;animation:spin 3s linear infinite;
    background:conic-gradient(from 0deg,transparent,rgba(255,215,0,.8),transparent 20%,rgba(255,120,0,.7),transparent 45%,rgba(255,215,0,.8),transparent 70%,rgba(255,255,255,.7),transparent)}
  .rv{position:relative;width:230px;height:330px;transform-style:preserve-3d;transform:scale(1.12);
    animation:flipIn 1.1s cubic-bezier(.2,.9,.3,1.1) backwards}
  @keyframes flipIn{0%{transform:rotateY(180deg) scale(.3)}55%{transform:rotateY(-14deg) scale(1.3)}100%{transform:rotateY(0) scale(1.12)}}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.back{transform:rotateY(180deg);
    clip-path:polygon(50% 0,92% 6%,100% 8%,100% 88%,50% 100%,0 88%,0 8%,8% 6%);
    background:linear-gradient(160deg,#16215f,#6a1bb0 50%,#00b3ff);display:flex;align-items:center;justify-content:center;
    font-size:4rem;font-weight:900;color:#ffd86b}
  .rv .scene{animation:none;opacity:1;transform:none}
  .rlabel{margin-top:6px;font-weight:900;letter-spacing:3px;font-size:1.05rem;animation:labelIn .6s .9s backwards}
  .rlabel.epic{color:#ffd86b;text-shadow:0 0 18px rgba(255,200,0,.9)}
  .rlabel.rare{color:#6be3ff}
  .rlabel.common{opacity:.8}
  .rlabel small{display:block;text-align:center;color:var(--accent);font-size:.8rem;margin-top:4px;letter-spacing:2px}
  @keyframes labelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pk-actions{display:flex;gap:12px;margin-top:18px;animation:labelIn .6s backwards}
  .pk-actions button{padding:12px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);color:#fff;font-weight:800;cursor:pointer;transition:.2s}
  .pk-actions button.main{background:linear-gradient(90deg,#ff9d00,#ffd86b);color:#2b1a00;border-color:transparent}
  .pk-actions button:hover{transform:translateY(-2px)}
  .cf{position:fixed;top:-20px;width:9px;height:15px;background:var(--c);left:var(--x);z-index:80;pointer-events:none;
    animation:fall var(--d) linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .epic-shake{animation:bigShake .6s}
  @keyframes bigShake{20%{transform:translate(-8px,5px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-3px)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .scene{opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<header>
  <h1>FC 27 · ULTIMATE CARDS</h1>
  <p>Los mejores jugadores del juego</p>
</header>

<section class="controls">
  <input id="q" type="search" placeholder="Buscar jugador o equipo...">
  <select id="nat"><option value="">🌍 Todas las nacionalidades</option></select>
  <select id="sort">
    <option value="ovr">Ordenar: Valoración</option>
    <option value="pac">Ordenar: Ritmo</option>
    <option value="sho">Ordenar: Tiro</option>
    <option value="name">Ordenar: Nombre</option>
  </select>
  <div class="chips" id="pos">
    <button class="chip on" data-p="">TODOS</button>
    <button class="chip" data-p="ATA">ATA</button>
    <button class="chip" data-p="MED">MED</button>
    <button class="chip" data-p="DEF">DEF</button>
    <button class="chip" data-p="POR">POR</button>
    <button class="chip" data-p="ICON">👑 ICONOS</button>
  </div>
  <button class="chip pack-btn" id="openPack">🎁 ABRIR SOBRE</button>
  <div id="count"></div>
</section>

<main class="grid" id="grid"></main>

<div id="modal"><div class="panel" id="panel"></div></div>
<div id="packs">
  <div id="pkCount"></div>
  <button id="pkClose" aria-label="Cerrar">×</button>
  <div id="pkStage"></div>
  <div id="flash"></div>
</div>
<div id="cutbar"><span></span><div><i></i></div></div>

<footer>FC 27 · Valoraciones de ejemplo, no oficiales · Pasa el ratón sobre las cartas y haz clic para ver el detalle</footer>

<script>

 {n:"Bellingham",full:"Jude Bellingham",c:"Real Madrid",ab:"RMA",col:"#6b5bd6",nat:"Inglaterra",f:"gb-eng",pos:"CAM",g:"MED",ovr:90,r:"gold",a:[80,86,85,89,78,84]},

 {n:"Kane",full:"Harry Kane",c:"Bayern München",ab:"FCB",col:"#dc052d",nat:"Inglaterra",f:"gb-eng",pos:"ST",g:"ATA",ovr:89,r:"gold",a:[70,94,85,83,48,83]},

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// fetch con reintentos: Wikipedia responde 429 si pides muchas cosas seguidas
async function fetchRetry(url,tries=6){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url);
      if(r.ok)return r;
      if(r.status!==429&&r.status<500)throw new Error('HTTP '+r.status);
    }catch(e){ if(i===tries-1)throw e }
    await sleep(1500*Math.pow(2,i));
  }
  throw new Error('demasiados intentos');
}

// consulta a Wikipedia en trozos de 25 títulos (con redirecciones). Devuelve {título: url}
async function wikiThumbs(titles,size){
  const out={};
  for(let i=0;i<titles.length;i+=25){
    const chunk=titles.slice(i,i+25).map(t=>t.replace(/_/g,' '));
    const u='https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&pithumbsize='+size
      +'&redirects=1&format=json&origin=*&titles='+encodeURIComponent(chunk.join('|'));
    const j=await (await fetchRetry(u)).json();
    const norm={},red={},byTitle={};
    (j.query.normalized||[]).forEach(x=>norm[x.from]=x.to);
    (j.query.redirects||[]).forEach(x=>red[x.from]=x.to);
    Object.values(j.query.pages).forEach(pg=>{byTitle[pg.title]=pg.thumbnail&&pg.thumbnail.source});
    chunk.forEach(t=>{let k=norm[t]||t;k=red[k]||k;out[t]=byTitle[k]||null});
    if(i+25<titles.length)await sleep(800);
  }
  return out;
}

// escudos que no vienen de football-data: se buscan en Wikipedia
async function loadCrests(){
  const clubs=Object.keys(CLUBWIKI).filter(c=>!CRESTURL[c]);
  if(!clubs.length)return;
  try{
    const m=await wikiThumbs(clubs.map(c=>CLUBWIKI[c]),120);
    clubs.forEach(c=>{const u=m[CLUBWIKI[c].replace(/_/g,' ')];if(u){CRESTURL[c]=u;applyCrest(c)}});
  }catch(e){console.warn('Escudos',e)}
}
async function wikiPhoto(p){
  if(!THUMBS)await fetchThumbs();
  const src=THUMBS[p.n];
  if(!src)throw new Error('sin foto');
  await sleep(500);
  return (await fetchRetry(src)).blob();
}

let removeBg=null;
async function getRemover(){
  if(!removeBg){
    const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    removeBg=m.removeBackground||m.default;
  }
  return removeBg;
}

async function loadPhotos(){
  loadCrests();
  const total=P.length;let done=0;
  // 1) lo que ya está en caché sale al instante
  for(const p of P){
    const c=await dbGet('cut-'+p.n);
    if(c){PH[p.n]={url:URL.createObjectURL(c),kind:'cut'};applyPhoto(p.n);done++}
  }
  const todo=P.filter(p=>!PH[p.n]);
  if(!todo.length){setStatus('');return}
  // 2) el resto: bajar foto -> quitar fondo -> guardar
  for(const p of todo){
    setStatus(`Recortando fotos… ${done}/${total} (la primera vez tarda un poco)`,done/total*100);
    let blob;
    try{blob=await wikiPhoto(p)}catch(e){console.warn('Sin foto',p.n,e);done++;continue}
    // mientras tanto, la foto normal en círculo
    PH[p.n]={url:URL.createObjectURL(blob),kind:'photo'};applyPhoto(p.n);
    try{
      const rm=await getRemover();
      const out=await rm(blob,{model:'isnet_quint8',output:{format:'image/png'}});
      await dbSet('cut-'+p.n,out);
      PH[p.n]={url:URL.createObjectURL(out),kind:'cut'};applyPhoto(p.n);
    }catch(e){console.warn('No se pudo recortar',p.n,e)}
    done++;
  }
  setStatus('');
}

function beep(freq,dur,type,vol,when){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur);
  }catch(e){}
}

  for(let i=0;i<P.length;i++){r-=w[i];if(r<=0)return P[i]}
  return P[P.length-1];
}

      <div class="pack"><div class="pk-in"><b>FC 27</b><span>ULTIMATE PACK</span><em>★ ORO PREMIUM ★</em></div></div>
    </div><p class="hint">Toca el sobre para abrirlo</p>`;
  const el=document.getElementById('pack');
  el.onclick=openPack;
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openPack()};
}
async function openPack(){
  if(busy)return;busy=true;
  const pack=document.getElementById('pack');
  stage.querySelector('.hint').style.display='none';
  pack.classList.add('shake');
  beep(90,1.0,'sawtooth',.05);beep(140,.9,'sawtooth',.04,.1);
  await sleep(1000);
  pack.classList.remove('shake');pack.classList.add('burst');
  const fl=document.getElementById('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  const p=pickPlayer(), isIcon=p.r==='icon', epic=p.ovr>=90||isIcon, rare=p.ovr>=89, isNew=!owned.has(p.n);
  beep(660,.25,'triangle',.08);beep(880,.3,'triangle',.08,.12);
  await sleep(550);
  owned.add(p.n);try{localStorage.setItem('fc27owned',JSON.stringify([...owned]))}catch(e){}
  updateCount();
  const kind=epic?'epic':rare?'rare':'common';
  const txt=isIcon?'👑 ¡ICONO LEYENDA!':epic?'🔥 ¡WALKOUT! CARTA ÉPICA':rare?'✨ CARTA RARA':'CARTA COMÚN';
  stage.innerHTML=`<div class="rv-wrap ${kind}"><div class="rv">
      <div class="face back">FC</div>
      <div class="face front">${cardHTML(p)}</div>
    </div></div>
    <div class="rlabel ${kind}">${txt}${isNew?'<small>¡NUEVA EN TU COLECCIÓN!</small>':'<small style="color:#fff;opacity:.6">YA LA TENÍAS</small>'}</div>`;
  countUp(stage);tilt(stage);
  if(epic){
    confetti();pk.classList.add('epic-shake');setTimeout(()=>pk.classList.remove('epic-shake'),700);
    [523,659,784,1047].forEach((f,i)=>beep(f,.4,'triangle',.08,i*.12));
  }else if(rare){[587,740,880].forEach((f,i)=>beep(f,.35,'triangle',.07,i*.1))}
  else{beep(440,.3,'triangle',.06)}
  await sleep(1800);
  stage.insertAdjacentHTML('beforeend',`<div class="pk-actions">
      <button class="main" id="again">🎁 Abrir otro sobre</button>
      <button id="done">Cerrar</button></div>`);
  document.getElementById('again').onclick=showPack;
  document.getElementById('done').onclick=closePacks;
  busy=false;
}
function closePacks(){pk.classList.remove('open');stage.innerHTML=''}
document.getElementById('openPack').addEventListener('click',()=>{pk.classList.add('open');showPack()});
document.getElementById('pkClose').addEventListener('click',closePacks);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePacks()});

render();
loadPhotos();
</script>
</body>
</html>
